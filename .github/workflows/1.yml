name: Run 2.py every 30 minutes

on:
  push:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'     # ВАЖНО! Включает автоматическое кеширование pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run 2.py
        run: python 2.py